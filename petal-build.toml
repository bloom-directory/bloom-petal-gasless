schema = "bloom.petal.build.v1"
name = "gasless"
routes = "route/files"
output = "petal/gasless"

[route_crate]
package = "gasless-route"
path = "route"
alias = "example_route"

[sdk]
package = "bloom-petal-sdk"
git = "https://github.com/bloom-directory/petal"
rev = "9e92e551c6a4ccc32704cef5b0e8ac4ed104e3b2"

[dependencies]
serde_json = "1"
