schema = "bloom.petal.package.v1"
name = "gasless"

[source]
kind = "github"
repository = "bloom-directory/bloom-petal-gasless"

[build]
command = "scripts/build.sh"
outputs = ["petal/gasless"]

[consent]
summary = "Execute caller-bounded Relay transfers and swaps from permit-compatible EVM tokens without origin gas, with exact route validation and owner approval."

[caps]
allowed = ["bloom:http", "bloom:store", "bloom:sign", "bloom:vfs.read"]

[[net.allow]]
binding = "relay"
host = "api.relay.link"
methods = ["get", "post"]
paths = ["/quote/v2", "/execute/permits", "/intents/status/v3"]

[sign]
allowed_intents = ["gasless.relay", "gasless.deposit"]

[store]
namespaces = ["state"]
