[package]
name = "gasless-route"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
alloy-dyn-abi = { version = "1.6", features = ["eip712"] }
# Exact-pinned: alloy-dyn-abi's EIP-712 hashing depends on the exact
# alloy-primitives version for type encoding compatibility. A patch
# release could change the encoding and silently invalidate signing hashes.
alloy-primitives = { version = "=1.6.1", default-features = false, features = ["std", "k256"] }
hex = "0.4"
petal = { package = "bloom-petal-sdk", git = "https://github.com/bloom-directory/petal", rev = "465d6f2464a6a87910128f5448d1543ccb2aeb2a", features = ["evm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
k256 = { version = "0.13", features = ["ecdsa"] }
